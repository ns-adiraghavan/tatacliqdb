name: Refresh dashboard data

# Runs when the admin uploads a new Excel or changes client visibility,
# regenerates the dashboard JSON with the real generate_json.py, and
# deploys the result to the EC2.
on:
  push:
    branches: [main]
    paths:
      - "data/incoming/latest.xlsx"
      - "public/data/visibility.json"
  workflow_dispatch: {}

# Prevent overlapping runs clobbering each other.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Regenerate whenever an Excel exists in the repo. Because the Excel
      # persists in the repo, every run (including visibility-only pushes)
      # rebuilds the full, real dataset — so we never deploy blank data
      # over good data.
      - name: Generate JSON
        run: |
          if [ -f data/incoming/latest.xlsx ]; then
            EXCEL_PATH=data/incoming/latest.xlsx OUTPUT_DIR=public/data \
              python scripts/generate_json.py
          else
            echo "No Excel uploaded yet — skipping generation (blank data will deploy)."
          fi

      - name: Deploy data to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          TARGET: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # TARGET must be a DEDICATED data-only folder that nginx serves
          # at /data — --delete keeps it in sync with the 6 JSON files.
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            public/data/ "$USER@$HOST:$TARGET/"
